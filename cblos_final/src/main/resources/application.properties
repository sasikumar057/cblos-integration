spring.application.name=loan-system
server.port=2727

spring.datasource.url=jdbc:mysql://localhost:3306/loan_db2
spring.datasource.username=root
spring.datasource.password=${SQL_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


salesforce.login-url=${SALESFORCE_LOGIN_URL}
salesforce.client-id=${SALESFORCE_CLIENT_ID}
salesforce.client-secret=${SALESFORCE_CLIENT_SECRET}

