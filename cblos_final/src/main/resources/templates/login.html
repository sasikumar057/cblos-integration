<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustEdge Commercial Bank - Secure Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-image: linear-gradient(135deg, #0b132b 0%, #1c2541 40%, #f4f6f9 40%, #f4f6f9 100%);
            min-height: 100vh;
        }
        .login-navbar { background-color: #0b132b; border-bottom: 3px solid #00b4d8; }
        .login-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            background-color: #ffffff;
        }
        .brand-header {
            background-color: #0b132b;
            color: #ffffff;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            border-bottom: 4px solid #198754; /* Green compliance line */
        }
        .form-control:focus, .form-select:focus {
            border-color: #00b4d8;
            box-shadow: 0 0 0 0.25rem rgba(0, 180, 216, 0.25);
        }
        .btn-gateway {
            background-color: #0b132b;
            color: #ffffff;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-gateway:hover {
            background-color: #1c2541;
            color: #6fffe9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark login-navbar py-2 shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="bi bi-shield-lock-fill text-info me-2 fs-4"></i>
                <span class="fw-bold text-uppercase tracking-wider text-white" style="font-size: 1rem;">TrustEdge Commercial Bank Core-LOS</span>
            </a>
            <span class="badge bg-success-subtle text-success border border-success px-3 py-1 font-monospace small">SSL_SECURE_NODE</span>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="col-md-5 col-lg-4">
                
                <div class="card login-card">
                    
                    <div class="brand-header p-4 text-center">
                        <i class="bi bi-bank2 text-info mb-2" style="font-size: 2.5rem;"></i>
                        <h5 class="fw-bold text-uppercase mb-1 tracking-wide">Enterprise Sign-In</h5>
                        <p class="text-muted small mb-0" style="font-size: 0.75rem;">Loan Origination & Portfolio Management System</p>
                    </div>

                    <div class="card-body p-4">
                        
                        <div th:if="${param.error}" class="alert alert-danger border-0 small py-2 shadow-sm d-flex align-items-center mb-3">
                            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                            <span>Invalid identification credentials or restricted clearance scope level.</span>
                        </div>
                        
                        <div th:if="${param.logout}" class="alert alert-success border-0 small py-2 shadow-sm d-flex align-items-center mb-3">
                            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                            <span>Session terminated successfully. Secure desk cleared.</span>
                        </div>

                        <form th:action="@{/login}" method="POST">
                            
                            <div class="mb-3">
                                <label for="userRole" class="form-label small fw-bold text-secondary mb-1">
                                    <i class="bi bi-person-gear text-muted me-1"></i> Authentication Clearance Portal *
                                </label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-white"><i class="bi bi-shield text-secondary"></i></span>
                                    <select id="userRole" name="userRole" class="form-select text-dark bg-light fw-bold" required>
                                        <option value="" selected disabled name ="role" >Select your workplace domain...</option>
                                        <option value="ADMIN" name ="role">System Configuration Administrator (ADMIN)</option>
                                        <option value="CUSTOMER" name ="role">Corporate Registrant Portal (CUSTOMER)</option>
                                        <option value="OFFICER" name ="role">Underwriting Risk Officer (OFFICER)</option>
                                        <option value="MANAGER" name ="role">Senior Credit Manager Hub (MANAGER)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="username" class="form-label small fw-bold text-secondary mb-1">
                                    <i class="bi bi-person-badge-fill text-muted me-1"></i> Account Username / Employee ID *
                                </label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-white"><i class="bi bi-person text-secondary"></i></span>
                                    <input type="text" id="username" name="username" class="form-control font-monospace" 
                                           placeholder="e.g., registrant@corp.com" required autocomplete="username">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label small fw-bold text-secondary mb-1">
                                    <i class="bi bi-key-fill text-muted me-1"></i> Security Key Phrase Password *
                                </label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-white"><i class="bi bi-lock text-secondary"></i></span>
                                    <input type="password" id="password" name="password" class="form-control" 
                                           placeholder="••••••••" required autocomplete="current-password">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-sm btn-gateway w-100 py-2 shadow-sm text-uppercase tracking-wider mb-2">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Establish Secure Session
                            </button>
                            
                        </form>
                    </div>

                    <div class="card-footer text-center bg-light py-2 rounded-bottom border-top">
                        <span class="text-muted font-monospace" style="font-size: 0.65rem;">
                            <i class="bi bi-shield-fill-check text-success"></i> Connected Node: TrustEdge Core Banking Systems
                        </span>
                    </div>

                </div>
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
